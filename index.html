<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e0e0e0">
  <title>vRetro Player</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="stylesheet" href="src/css/themes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
</head>
<body>
  <div id="vmusic-page-buttons">
    <button id="infoBtn" title="Info"><i class="fa-solid fa-circle-info"></i></button>
    <button id="resetBtn" title="Reset"><i class="fa-solid fa-rotate-right"></i></button>
  </div>
  <div class="vpod-container">
    <div class="vpod-screen" id="vpodScreen">
      <div id="splashScreen" style="position:absolute;z-index:9999;inset:0;background:#333333;display:flex;align-items:center;justify-content:center;transition:opacity 4s;">
      <img src="src/img/logo.png" alt="Logo" style="width:96px;height:96px;">
    </div>
    <div id="hotBar" style="width:100%;height:22px;display:flex;align-items:center;justify-content:center;font-size:1em;color:#222;z-index:10;">
      <span id="hotBarTime" style="flex:1;text-align:center;font-weight:bold;"></span>
      <span style="position:absolute;right:4px;top:0px;font-size:1.3em;">
        <span id="hotBarPlayState" style="margin-right:2px;font-size:0.7em;color:#0074d9;position:relative;top:-8px;"></span>
        <span id="hotBarBattery" title="Battery Full">
          <svg width="40" height="36" viewBox="0 0 28 30" style="vertical-align:middle;">
            <rect x="1" y="3" width="24" height="8" rx="2" fill="#fff" stroke="#222" stroke-width="1"/>
            <rect x="2" y="4" width="22" height="6" rx="1" fill="url(#batteryGradient)"/>
            <rect x="25" y="6" width="2" height="2" rx="1" fill="#222"/>
            <defs>
              <linearGradient id="batteryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="60%" stop-color="#0074d9" />
                <stop offset="100%" stop-color="#4fc3f7" />
              </linearGradient>
            </defs>
          </svg>
        </span>
      </span>
    </div>
    </div>
    <div class="vpod-controls">
      <div class="vpod-disk">
        <button id="menuBtn" class="vpod-disk-btn vpod-disk-menu">MENU</button>
        <button id="prevBtn" class="vpod-disk-btn vpod-disk-prev">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="nextBtn" class="vpod-disk-btn vpod-disk-next">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button id="playPauseBtn" class="vpod-disk-btn vpod-disk-play">
          <i class="fa-solid fa-play"></i>
        </button>
        <button id="confirmBtn" class="vpod-disk-center"></button>
        <div id="diskTouch" class="vpod-disk-touch"></div>
      </div>
    </div>
    <audio id="audioPlayer" style="display:none;"></audio>
    <script src="src/js/core.js"></script>
    <script src="src/js/ui/mainUi.js"></script>
    <script src="src/js/ui/mainMenu.js"></script>
    <script src="src/js/ui/loadMenu.js"></script>
    <script src="src/js/ui/recapMenu.js"></script>
    <script src="src/js/ui/nowPlaying.js"></script>
    <script src="src/js/ui/playlists.js"></script>
    <script src="src/js/ui/albumMenu.js"></script>
    <script src="src/js/ui/artistMenu.js"></script>
    <script src="src/js/ui/songsMenu.js"></script>
    <script src="src/js/ui/suggestions.js"></script>
    <script src="src/js/ui/gamesMenu.js"></script>
    <script src="src/js/ui/settingsMenu.js"></script>
    <script src="src/js/handler.js"></script>
    <script src="src/js/audio.js"></script>
    <script src="src/js/nav.js"></script>
    <script src="src/js/main.js"></script>
  </div>
</body>
</html>
